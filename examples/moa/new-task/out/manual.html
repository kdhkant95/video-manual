<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 작업 만들기 — 모아</title>
<style>* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }

#fit { position: absolute; inset: 0 0 52px 0; }
#stage { position: absolute; left: 50%; top: 50%; overflow: hidden; font-family: var(--font); transform-origin: center center; }

/* Capture mode: the stage fills the viewport 1:1 and the controls disappear. */
body.capture #fit { inset: 0; }
body.capture #stage { left: 0; top: 0; transform: none; }
body.capture #controls { display: none; }

#controls { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #14171f; color: #cbd2de; font: 500 13px/1 system-ui, sans-serif; }
#controls button { width: 36px; height: 32px; border: 0; border-radius: 8px; background: #262b38; color: #fff; font-size: 13px; cursor: pointer; }
#controls input { flex: 1; accent-color: #8b9cff; }
#clock { font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }

.vm-shot { position: absolute; inset: 0; will-change: opacity, transform; }

.vm-frame { position: absolute; overflow: hidden; background: #fff; border-radius: var(--frame-radius); box-shadow: var(--frame-shadow); }
.vm-frame.is-phone { background: #0b0b0d; border-radius: 52px; }
.vm-chrome { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 0 18px; background: var(--chrome-bg); border-bottom: 1px solid color-mix(in srgb, var(--chrome-fg) 10%, transparent); }
.vm-chrome i { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--chrome-fg) 18%, transparent); }
.vm-chrome span { margin-left: 14px; flex: 0 1 520px; height: 26px; padding: 0 14px; border-radius: 13px; background: color-mix(in srgb, var(--chrome-fg) 8%, transparent); color: color-mix(in srgb, var(--chrome-fg) 55%, transparent); font: 500 14px/26px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vm-view { position: absolute; overflow: hidden; background: #fff; }
.vm-frame.is-phone .vm-view { border-radius: 38px; }
.vm-content { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.vm-content img { display: block; width: 100%; height: 100%; }

.vm-hl { position: absolute; border-style: solid; border-color: var(--accent); pointer-events: none; }
.vm-hl-label { position: absolute; left: 0; padding: 9px 14px; border-radius: 9px; background: var(--accent); color: var(--accent-text); font: 700 22px/1 var(--font); white-space: nowrap; }

.vm-typed { position: absolute; display: flex; align-items: center; overflow: hidden; white-space: pre; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif; }
.vm-caret { flex: none; width: 0.08em; height: 1.15em; margin-left: 0.06em; background: currentColor; }

.vm-cursor { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.35)); }
.vm-cursor.is-dot { border-radius: 50%; border: 3px solid #fff; background: color-mix(in srgb, var(--accent) 38%, transparent); }
.vm-ripple { position: absolute; border-radius: 50%; border: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 24%, transparent); pointer-events: none; }

.vm-capzone { position: absolute; left: 0; right: 0; bottom: 0; }
.vm-caption { position: absolute; left: 50%; top: 50%; display: flex; align-items: center; gap: 20px; width: max-content; max-width: var(--cap-max); color: var(--cap-text); font: var(--cap-weight) var(--cap-size) / 1.4 var(--font); word-break: keep-all; will-change: transform, opacity; }
.vm-caption.is-bar { padding: 18px 36px 18px 20px; border-radius: 24px; background: var(--cap-bg); box-shadow: 0 14px 44px rgba(0, 0, 0, 0.22); }
.vm-step { flex: none; min-width: 56px; height: 56px; padding: 0 14px; border-radius: 28px; background: var(--accent); color: var(--accent-text); font: 700 24px/56px var(--font); text-align: center; font-variant-numeric: tabular-nums; }

.vm-w { display: inline-block; white-space: nowrap; }
.vm-u { display: inline-block; will-change: transform, opacity; }

.vm-card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 0 180px; color: var(--text); text-align: center; word-break: keep-all; }
.vm-card h1 { margin: 0; font: var(--title-weight) var(--title-size) / 1.22 var(--font); letter-spacing: -0.02em; }
.vm-card p { margin: 0; color: var(--muted); font: 500 var(--sub-size) / 1.5 var(--font); }
.vm-rule { width: 76px; height: 6px; border-radius: 3px; background: var(--accent); }

.vm-progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--accent); }

/* Emphasis: **words** in captions, titles and callouts. */
.vm-em { color: color-mix(in srgb, var(--accent) 55%, currentColor); font-weight: 800; }

/* On-screen text: callout bubbles pinned to a point, and centred banners. */
.vm-pop { position: absolute; left: 0; top: 0; word-break: keep-all; pointer-events: none; will-change: transform, opacity; }
.vm-pop.is-bubble { max-width: 520px; padding: 13px 22px; border-radius: 16px; background: var(--accent); color: var(--accent-text); font: 700 28px/1.35 var(--font); box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28); }
.vm-pop.is-bubble .vm-em { color: inherit; text-decoration: underline; text-underline-offset: 0.18em; }
.vm-pop-tail { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
.vm-pop.is-banner { max-width: 1100px; padding: 28px 56px; border-radius: 28px; background: rgba(8, 12, 24, 0.84); color: #fff; font: 800 68px/1.25 var(--font); letter-spacing: -0.02em; text-align: center; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4); }
.vm-pop.is-banner .vm-em { color: color-mix(in srgb, var(--accent) 55%, #fff); }

/* Review panel (preview only). */
.vm-edit-toggle { width: auto !important; padding: 0 14px; white-space: nowrap; }
#editor { position: absolute; top: 0; right: 0; bottom: 52px; width: 400px; display: none; flex-direction: column; background: #171a23; border-left: 1px solid #262b38; color: #dfe4ee; font: 400 13px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif; }
body.editing #editor { display: flex; }
body.editing #fit { right: 400px; }
body.editing .vm-edit-toggle { background: #8b9cff; color: #0b0d12; }
#editor header { padding: 18px 20px 14px; border-bottom: 1px solid #262b38; }
#editor h2 { margin: 0 0 6px; font-size: 16px; }
#editor header p { margin: 0; color: #98a1b3; }
.vm-ed-list { flex: 1; overflow-y: auto; padding: 12px; }
.vm-ed-card { margin-bottom: 10px; padding: 10px 12px 12px; border: 1px solid #2a3040; border-radius: 12px; background: #1d212c; }
.vm-ed-card.on { border-color: #8b9cff; }
.vm-ed-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
.vm-ed-top b { padding: 2px 9px; border-radius: 10px; background: #2f3650; color: #c9d1ff; font-size: 12px; font-variant-numeric: tabular-nums; }
.vm-ed-top span { flex: 1; overflow: hidden; color: #7f889b; font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
.vm-ed-top button { width: 28px; height: 26px; border: 0; border-radius: 7px; background: #2a3040; color: #dfe4ee; cursor: pointer; }
.vm-ed-top button:disabled { opacity: 0.3; cursor: default; }
.vm-ed-field { display: block; margin-top: 8px; }
.vm-ed-field > span { display: block; margin-bottom: 3px; color: #98a1b3; font-size: 12px; }
.vm-ed-field em { color: #ffb86b; font-style: normal; }
.vm-ed-field textarea { display: block; width: 100%; padding: 7px 9px; border: 1px solid #2f3648; border-radius: 8px; background: #12151c; color: #f1f4fa; font: inherit; font-size: 14px; resize: none; overflow: hidden; }
.vm-ed-field textarea:focus { outline: 2px solid #8b9cff; outline-offset: -1px; }
#editor footer { display: flex; align-items: center; gap: 8px; padding: 12px; border-top: 1px solid #262b38; }
.vm-ed-status { flex: 1; color: #7f889b; }
.vm-ed-status.dirty { color: #ffb86b; }
#editor footer button { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: #2a3040; color: #dfe4ee; font: inherit; cursor: pointer; }
#editor footer button.primary { background: #8b9cff; color: #0b0d12; font-weight: 700; }

/* Brand logo. */
.vm-logo { max-width: 360px; max-height: 84px; margin-bottom: 8px; object-fit: contain; will-change: transform, opacity; }
.vm-logo-corner { position: absolute; top: 50%; max-width: 190px; max-height: 44px; object-fit: contain; transform: translateY(-50%); }
</style>
</head>

<script>/*
 * Timeline compiler for video manuals.
 *
 * Pure logic, no DOM: turns a storyboard + motion profile + image sizes into a

          const card = $('div', 'vm-card vm-' + sc.type, layer);
          shot.card = { scene: sc, titleUnits: [], subUnits: [] };
          if (logoSrc && logoOn !== 'corner') {
            shot.card.logo = $('img', 'vm-logo', card);
            shot.card.logo.src = logoSrc;
          }
          if (sc.title) shot.card.titleUnits = buildText($('h1', '', card), sc.title, P.text.unit);
          shot.card.rule = $('div', 'vm-rule', card);
          if (sc.subtitle) shot.card.subUnits = buildText($('p', '', card), sc.subtitle, P.text.unit);
          return;
        }

        const L = shot.layout;
        const frame = $('div', 'vm-frame is-' + L.mode, layer);
        Object.assign(frame.style, { left: L.frame.x + 'px', top: L.frame.y + 'px', width: L.frame.w + 'px', height: L.frame.h + 'px' });
        if (L.mode === 'browser') {
          const bar = $('div', 'vm-chrome', frame);
          bar.style.height = L.chromeH + 'px';
          $('i', '', bar);
          $('i', '', bar);
          $('i', '', bar);
          if (TL.meta.url) $('span', '', bar).textContent = TL.meta.url;
        }
        const view = $('div', 'vm-view', frame);
        Object.assign(view.style, { left: L.bezel + 'px', top: L.bezel + L.chromeH + 'px', width: L.view.w + 'px', height: L.view.h + 'px' });
        const content = $('div', 'vm-content', view);
        Object.assign(content.style, { width: L.coordW + 'px', height: L.coordH + 'px' });
        $('img', '', content).src = IMGS[shot.image].src;
        shot.content = content;

        shot.typed.forEach((ty) => {
          const [x, y, w, h] = ty.rect;
          const el = $('div', 'vm-typed', content);
          Object.assign(el.style, {
            left: x + 'px',
            top: y + 'px',
            width: w + 'px',
            height: h + 'px',
            fontSize: (ty.fontSize || h * 0.42) + 'px',
            color: ty.color || '#111827',
            background: ty.bg || 'transparent',
            paddingLeft: (ty.padding == null ? h * 0.3 : ty.padding) + 'px',
          });
          ty.textEl = $('span', '', el);
          ty.caret = $('span', 'vm-caret', el);
          ty.el = el;
          ty.chars = Array.from(ty.text);
        });

        shot.highlights.forEach((h) => {
          h.el = $('div', 'vm-hl', content);
          if (h.label) {
            h.labelEl = $('div', 'vm-hl-label', h.el);
            h.labelEl.textContent = h.label;
          }
        });
      });

      // Overlays, in stacking order: callouts, ripples, cursor, captions.
      TL.shots.forEach((shot) => {
        shot.texts.forEach((b) => {
          b.el = $('div', 'vm-pop is-' + b.style, stage);
          b.units = buildText($('div', 'vm-pop-body', b.el), b.text, b.cfg.unit);
          if (b.style === 'bubble') b.tail = $('i', 'vm-pop-tail', b.el);
        });
      });

      const ripples = TL.clicks.map(() => $('div', 'vm-ripple', stage));

      const cursor = $('div', 'vm-cursor is-' + P.cursor.style, stage);
      const CS = P.cursor.size;
      cursor.style.width = cursor.style.height = CS + 'px';
      // Hotspot: the arrow's tip, or the dot's centre.
      const hot = P.cursor.style === 'dot' ? { x: CS / 2, y: CS / 2 } : { x: (CS * 4) / 24, y: (CS * 2) / 24 };
      cursor.style.transformOrigin = `${hot.x}px ${hot.y}px`;
      cursor.innerHTML =
        P.cursor.style === 'dot'
          ? ''
          : '<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M4 2v18l4.6-4.3 3.1 6.9 2.8-1.3-3.1-6.7h6.3z" fill="#111" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>';

      const capzone = $('div', 'vm-capzone', stage);
      capzone.style.height = P.caption.zone + 'px';
      const captions = [];
      TL.scenes.forEach((sc) => {
        sc.captions.forEach((cap) => {
          cap.el = $('div', 'vm-caption is-' + P.caption.style, capzone);
          if (P.caption.showStep) $('div', 'vm-step', cap.el).textContent = sc.step + '/' + TL.totalSteps;
          cap.units = buildText($('div', 'vm-captext', cap.el), cap.text, P.text.unit);
          captions.push(cap);
        });
      });
      const lastCap = captions[captions.length - 1];

      let cornerLogo = null;
      if (logoSrc && (logoOn === 'corner' || logoOn === 'both')) {
        cornerLogo = $('img', 'vm-logo-corner', capzone);
        cornerLogo.src = logoSrc;
        cornerLogo.style.left = P.canvas.padding + 'px';
      }

      const progress = P.progress ? $('div', 'vm-progress', stage) : null;

      function renderShot(shot, k, t) {
        const next = TL.shots[k + 1];
        const visible = t >= shot.t0 && (!next || t < next.t0 + TL.trD);
        shot.el.style.display = visible ? '' : 'none';
        if (!visible) return;

        const kin = k === 0 ? 1 : ease(P.transition.easing, prog(t, shot.t0, TL.trD));
        const kout = next ? ease(P.transition.easing, prog(t, next.t0, TL.trD)) : 0;
        // When the next screen has the same frame, this one stays solid underneath
        // so the frame does not flicker through to the background.
        const stays = next && next.keepPrev;
        shot.el.style.opacity = kin * (stays ? 1 : 1 - kout);
        let tf = '';
        if (P.transition.type === 'slide') tf = `translateX(${(1 - kin) * 90 - (stays ? 0 : kout * 90)}px)`;
        else if (P.transition.type === 'crossfade' && !shot.keepPrev) tf = `scale(${0.985 + 0.015 * kin})`;
        shot.el.style.transform = tf;

        if (shot.kind === 'card') {
          const lt = t - shot.card.scene.textT0;
          applyText(shot.card.titleUnits, lt, P.text);
          applyText(shot.card.subUnits, lt - 0.35, P.text);
          const r = ease('easeOutCubic', prog(lt, 0.15, 0.6));
          shot.card.rule.style.transform = `scaleX(${r})`;
          shot.card.rule.style.opacity = r;
          if (shot.card.logo) {
            const lg = ease('easeOutCubic', prog(lt, -0.1, 0.6));
            shot.card.logo.style.opacity = lg;
            shot.card.logo.style.transform = `translateY(${(1 - lg) * 12}px)`;
          }
          return;
        }

        const L = shot.layout;
        const cam = T.evalCam(shot, t);
        const p = T.stagePos(L, cam, 0, 0);
        const S = p.S;
        shot.content.style.transform = `translate(${p.tx}px, ${p.ty}px) scale(${S})`;

        for (const h of shot.highlights) {
          const on = t >= h.t0 && t <= h.t1;
          h.el.style.display = on ? '' : 'none';
          if (!on) continue;
          const hin = ease(P.highlight.easing, prog(t, h.t0, P.highlight.duration));
          const a = clamp(prog(t, h.t0, P.highlight.duration * 0.6), 0, 1) * (1 - prog(t, h.t1 - 0.25, 0.25));
          const pulse = P.highlight.pulse ? 1 + 0.5 * Math.max(0, Math.sin((t - h.t0 - P.highlight.duration) * 5)) : 1;
          // Starts loose and tightens onto the target; all sizes are divided by S
          // so the ring keeps its stage thickness while the camera zooms.
          const grow = (P.highlight.padding * pulse + (1 - hin) * 18) / S;
          const bw = P.highlight.width / S;
          const [x, y, w, hh] = h.rect;
          Object.assign(h.el.style, {
            left: x - grow - bw + 'px',
            top: y - grow - bw + 'px',
            width: w + (grow + bw) * 2 + 'px',
            height: hh + (grow + bw) * 2 + 'px',
            borderWidth: bw + 'px',
            borderRadius: (P.highlight.radius + P.highlight.padding) / S + 'px',
            opacity: a,
            boxShadow:
              `0 0 0 9999px rgba(${DIM}, ${P.highlight.dim})` +
              (P.highlight.glow ? `, 0 0 ${28 / S}px color-mix(in srgb, var(--accent) ${P.highlight.glow * 100}%, transparent)` : ''),
          });
          if (h.labelEl) {
            const below = (y - grow) * S < 70;
            Object.assign(h.labelEl.style, {
              transform: `scale(${1 / S})`,
              transformOrigin: below ? '0 0' : '0 100%',
              top: below ? `calc(100% + ${12 / S}px)` : 'auto',
              bottom: below ? 'auto' : `calc(100% + ${12 / S}px)`,
            });
          }
        }

        for (const ty of shot.typed) {
          const on = t >= ty.t0;
          ty.el.style.display = on ? '' : 'none';
          if (!on) continue;
          const n = Math.floor(prog(t, ty.t0, ty.d) * ty.chars.length + 1e-6);
          ty.textEl.textContent = ty.chars.slice(0, n).join('');
          const since = t - (ty.t0 + ty.d);
          ty.caret.style.opacity = since < 0 ? 1 : since < 1.2 && Math.floor(since * 2.5) % 2 === 0 ? 1 : 0;
        }
      }

      // Callouts live in stage space so they keep their size while the camera
      // zooms, but stay pinned to a point on the screenshot.
      function renderTexts(shot, t) {
        if (shot.kind !== 'screen') return;
        const L = shot.layout;
        for (const b of shot.texts) {
          const on = t >= b.t0 && t < b.t1;
          b.el.style.display = on ? '' : 'none';
          if (!on) continue;
          const kin = ease(P.text.easing, prog(t, b.t0, 0.35));
          const a = prog(t, b.t0, 0.2) * (1 - prog(t, b.t1 - 0.2, 0.2));
          b.el.style.opacity = a;
          applyText(b.units, t - b.t0 - 0.1, b.cfg);
          const sc = 0.86 + 0.14 * kin;
          if (b.style === 'banner' || !b.uv) {
            const cx = L.view.x + L.view.w / 2;
            const cy = L.view.y + L.view.h / 2;
            b.el.style.transformOrigin = '50% 50%';
            b.el.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%) scale(${sc})`;
            continue;
          }
          const sp = T.stagePos(L, T.evalCam(shot, t), b.uv.u, b.uv.v);
          const w = b.el.offsetWidth;
          const h = b.el.offsetHeight;
          const gap = 26;
          const place = b.place || (sp.y - L.view.y < h + gap + 30 ? 'bottom' : 'top');
          let x;
          let y;
          if (place === 'top' || place === 'bottom') {
            x = clamp(sp.x - w / 2, 24, W - w - 24);
            y = place === 'top' ? sp.y - gap - h : sp.y + gap;
            const tx = clamp(sp.x - x, 22, w - 22);
            Object.assign(b.tail.style, { left: tx + 'px', top: place === 'top' ? '100%' : '0' });
            b.el.style.transformOrigin = `${tx}px ${place === 'top' ? h : 0}px`;
          } else {
            y = clamp(sp.y - h / 2, 24, H - h - 24);
            x = place === 'left' ? sp.x - gap - w : sp.x + gap;
            const ty = clamp(sp.y - y, 18, h - 18);
            Object.assign(b.tail.style, { top: ty + 'px', left: place === 'left' ? '100%' : '0' });
            b.el.style.transformOrigin = `${place === 'left' ? w : 0}px ${ty}px`;
          }
          b.el.style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
        }
      }

      function renderOverlays(t) {
        // The shot that owns the cursor right now.
        let k = 0;
        while (k + 1 < TL.shots.length && t >= TL.shots[k + 1].t0) k++;
        const curShot = TL.shots[k];
        let host = curShot;
        let fade = 1;
        if (curShot.kind === 'card') {
          // Fade the cursor out over the screen it was last on.
          host = null;
          for (let j = k - 1; j >= 0; j--) if (TL.shots[j].kind === 'screen') { host = TL.shots[j]; break; }
          fade = 1 - prog(t, curShot.t0, TL.trD * 0.5 || 0.001);
        } else if (k > 0 && TL.shots[k - 1].kind === 'card') {
          fade = prog(t, curShot.t0 + TL.trD * 0.5, TL.trD * 0.5 || 0.001);
        }

        // The corner logo shows over screens only, fading with the cursor.
        if (cornerLogo) cornerLogo.style.opacity = curShot.kind === 'card' && k === 0 ? 0 : fade;

        const pos = TL.cursorShowT == null ? null : T.evalCursor(TL, t);
        const show = pos && host && fade > 0 && t >= TL.cursorShowT;
        cursor.style.display = show ? '' : 'none';
        if (show) {
          const sp = T.stagePos(host.layout, T.evalCam(host, t), pos.u, pos.v);
          let press = 1;
          for (const c of TL.clicks) {
            const ck = (t - c.t) / 0.3;
            if (ck > 0 && ck < 1) press = 1 - (1 - P.click.press) * Math.sin(Math.PI * ck);
          }
          cursor.style.opacity = fade * prog(t, TL.cursorShowT, 0.25);
          cursor.style.transform = `translate(${sp.x - hot.x}px, ${sp.y - hot.y}px) scale(${press})`;
        }

        TL.clicks.forEach((c, i) => {
          const r = ripples[i];
          const rk = prog(t, c.t, P.click.rippleDuration);
          const on = t >= c.t && rk < 1;
          r.style.display = on ? '' : 'none';
          if (!on) return;
          const shot = TL.shots[c.shot];
          const sp = T.stagePos(shot.layout, T.evalCam(shot, t), c.u, c.v);
          const size = P.click.rippleSize * ease('easeOutCubic', rk);
          Object.assign(r.style, {
            left: sp.x - size / 2 + 'px',
            top: sp.y - size / 2 + 'px',
            width: size + 'px',
            height: size + 'px',
            opacity: (1 - rk) * 0.9,
          });
        });

        for (const cap of captions) {
          const on = t >= cap.t0 && t < cap.t1;
          cap.el.style.display = on ? '' : 'none';
          if (!on) continue;
          const lt = t - cap.t0;
          const kin = ease('easeOutCubic', prog(lt, 0, 0.3));
          const out = cap === lastCap ? 0 : prog(t, cap.t1 - 0.2, 0.2);
          cap.el.style.opacity = kin * (1 - out);
          cap.el.style.transform = `translate(-50%, -50%) translateY(${(1 - kin) * 14}px)`;
          applyText(cap.units, lt - 0.08, P.text);
        }

        if (progress) progress.style.width = (t / TL.duration) * 100 + '%';
      }

      return {
        TL,
        render(t) {
          TL.shots.forEach((shot, k) => renderShot(shot, k, t));
          TL.shots.forEach((shot) => renderTexts(shot, t));
          renderOverlays(t);
        },
      };
    }

    return { mount };
  }

  root.VMStage = { create, readableOn, canvasBackground, templates: Object.keys(TEMPLATES) };
})(window);
</script>
<script>/*
 * Standalone preview page for a built video manual: playback controls and a
 * review panel around the stage renderer (stage.js).
 */
(function () {
  'use strict';

  const SB0 = window.__STORYBOARD__;
  const P = window.__PROFILE__;
  const IMGS = window.__IMAGES__;
  const T = window.VMTimeline;
  const { clamp } = T;
  const meta0 = Object.assign({ width: 1920, height: 1080, lang: 'ko' }, SB0.meta || {});
  const W = meta0.width;
  const H = meta0.height;
  const capture = /[?&]capture\b/.test(location.search);

  const $ = (tag, cls, parent) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (parent) parent.appendChild(el);
    return el;
  };

  const stage = document.getElementById('stage');
  if (capture) document.body.classList.add('capture');
  const mount = window.VMStage.create(stage, P, IMGS).mount;

  // --- Playback -----------------------------------------------------------

  let M = mount(SB0);
  let now = 0;
  function render(t) {
    now = clamp(t, 0, M.TL.duration);
    M.render(now);
  }

  const fitEl = document.getElementById('fit');
  function fit() {
    if (capture) return;
    const k = Math.min(fitEl.clientWidth / W, fitEl.clientHeight / H);
    stage.style.transform = `translate(-50%, -50%) scale(${k})`;
  }
  window.addEventListener('resize', fit);

  const btn = document.getElementById('play');
  const bar = document.getElementById('seek');
  const clock = document.getElementById('clock');
  const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  let playing = false;
  let lastTs = 0;
  let onTick = () => {};

  function syncUi() {
    bar.value = Math.round((now / M.TL.duration) * 1000);
    clock.textContent = fmt(now) + ' / ' + fmt(M.TL.duration);
    btn.textContent = playing ? '❚❚' : '▶';
    onTick();
  }
  function tick(ts) {
    if (!playing) return;
    render(now + (ts - lastTs) / 1000);
    lastTs = ts;
    if (now >= M.TL.duration) playing = false;
    syncUi();
    if (playing) requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    playing = on;
    if (on) {
      if (now >= M.TL.duration) render(0);
      lastTs = performance.now();
      requestAnimationFrame(tick);
    }
    syncUi();
  }
  function seekTo(t) {
    playing = false;
    render(t);
    syncUi();
  }
  btn.addEventListener('click', () => setPlaying(!playing));
  bar.addEventListener('input', () => seekTo((bar.value / 1000) * M.TL.duration));
  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || /^(TEXTAREA|INPUT|BUTTON)$/.test(e.target.tagName)) return;
    e.preventDefault();
    setPlaying(!playing);
  });

  // Used by render.mjs to drive frame capture.
  window.__vm = {
    width: W,
    height: H,
    fps: M.TL.meta.fps,
    duration: M.TL.duration,
    stills: M.TL.stills,
    seek: render,
  };

  // --- Review panel -------------------------------------------------------
  //
  // Lets the reviewer reword any text and reorder scenes, see the change in the
  // video at once, and export the edited storyboard to hand back.

  const KO = /^ko/.test(meta0.lang);
  const L10N = KO
    ? {
        toggle: '✎ 문구·순서 수정',
        heading: '검수',
        hint: '문구를 고치거나 순서를 바꾸면 영상에 바로 반영됩니다. **단어**처럼 감싸면 강조됩니다. 끝나면 수정본을 내려받거나 복사해서 Claude에게 전달하세요.',
        save: '수정본 내려받기',
        copy: '복사',
        copied: '복사됨',
        reset: '되돌리기',
        dirty: '수정됨',
        clean: '변경 없음',
        up: '위로',
        down: '아래로',
        long: '두 줄을 넘습니다',
        kinds: { title: '타이틀', outro: '아웃트로' },
        fields: { caption: '자막', title: '제목', subtitle: '부제', mid: '중간 자막', text: '화면 텍스트', type: '입력되는 글자', label: '하이라이트 라벨' },
      }
    : {
        toggle: '✎ Edit text & order',
        heading: 'Review',
        hint: 'Reword any text or reorder the scenes and the video updates at once. Wrap words in **asterisks** to emphasise them. When you are done, download or copy the edited storyboard and hand it to Claude.',
        save: 'Download edits',
        copy: 'Copy',
        copied: 'Copied',
        reset: 'Reset',
        dirty: 'Edited',
        clean: 'No changes',
        up: 'Move up',
        down: 'Move down',
        long: 'Runs past two lines',
        kinds: { title: 'Title', outro: 'Outro' },
        fields: { caption: 'Caption', title: 'Title', subtitle: 'Subtitle', mid: 'Mid-step caption', text: 'On-screen text', type: 'Typed text', label: 'Highlight label' },
      };

  function setupEditor() {
    const original = JSON.stringify(SB0);
    let draft = JSON.parse(original);
    const maxWidth = (P.voice && P.voice.maxWidth) || Math.floor((P.caption.maxWidth / (P.font.captionSize * 0.95)) * 2);

    const controls = document.getElementById('controls');
    const toggle = $('button', 'vm-edit-toggle', controls);
    toggle.type = 'button';
    toggle.textContent = L10N.toggle;

    const panel = $('aside', '', document.body);
    panel.id = 'editor';
    const head = $('header', '', panel);
    $('h2', '', head).textContent = L10N.heading;
    $('p', '', head).textContent = L10N.hint;
    const list = $('div', 'vm-ed-list', panel);
    const foot = $('footer', '', panel);
    const status = $('span', 'vm-ed-status', foot);
    const mkBtn = (label, cls) => {
      const b = $('button', cls || '', foot);
      b.type = 'button';
      b.textContent = label;
      return b;
    };
    const resetBtn = mkBtn(L10N.reset);
    const copyBtn = mkBtn(L10N.copy);
    const saveBtn = mkBtn(L10N.save, 'primary');

    const exported = () => JSON.stringify(draft, null, 2) + '\n';
    const isDirty = () => JSON.stringify(draft) !== original;
    let cards = [];

    function remount(seekScene) {
      M = mount(draft);
      window.__vm.duration = M.TL.duration;
      window.__vm.stills = M.TL.stills;
      const sc = seekScene == null ? null : M.TL.scenes[seekScene];
      seekTo(sc ? Math.min(sc.t0 + 1.2, sc.t1 - 0.05) : Math.min(now, M.TL.duration));
      status.textContent = isDirty() ? '● ' + L10N.dirty : L10N.clean;
      status.classList.toggle('dirty', isDirty());
    }

    let timer = 0;
    function field(card, label, obj, key, i, checkLength) {
      const row = $('label', 'vm-ed-field', card);
      const cap = $('span', '', row);
      cap.textContent = label;
      const warn = $('em', '', cap);
      const ta = $('textarea', '', row);
      ta.value = obj[key] || '';
      ta.rows = 1;
      const size = () => {
        ta.style.height = 'auto';
        ta.style.height = ta.scrollHeight + 2 + 'px';
        warn.textContent = checkLength && T.textWidth(ta.value) > maxWidth ? ' · ' + L10N.long : '';
      };
      ta.addEventListener('input', () => {
        obj[key] = ta.value;
        size();
        clearTimeout(timer);
        timer = setTimeout(() => remount(i), 200);
      });
      ta.addEventListener('focus', () => {
        const sc = M.TL.scenes[i];
        if (sc && (now < sc.t0 || now >= sc.t1)) seekTo(Math.min(sc.t0 + 1.2, sc.t1 - 0.05));
      });
      requestAnimationFrame(size);
    }

    function move(i, d) {
      const j = i + d;
      if (j < 0 || j >= draft.scenes.length) return;
      const s = draft.scenes;
      [s[i], s[j]] = [s[j], s[i]];
      rebuild();
      remount(j);
      cards[j].scrollIntoView({ block: 'nearest' });
    }

    function rebuild() {
      list.textContent = '';
      cards = [];
      let step = 0;
      const total = draft.scenes.filter((s) => s.type === 'screen').length;
      draft.scenes.forEach((sc, i) => {
        const card = $('section', 'vm-ed-card', list);
        cards.push(card);
        const top = $('div', 'vm-ed-top', card);
        const badge = $('b', '', top);
        badge.textContent = sc.type === 'screen' ? ++step + '/' + total : L10N.kinds[sc.type] || sc.type;
        const name = $('span', '', top);
        name.textContent = sc.image ? sc.image.split('/').pop() : '';
        const arrow = (label, glyph, d) => {
          const b = $('button', '', top);
          b.type = 'button';
          b.title = label;
          b.setAttribute('aria-label', label);
          b.textContent = glyph;
          b.disabled = i + d < 0 || i + d >= draft.scenes.length;
          b.addEventListener('click', (e) => {
            e.stopPropagation();
            move(i, d);
          });
        };
        arrow(L10N.up, '↑', -1);
        arrow(L10N.down, '↓', 1);
        top.addEventListener('click', () => {
          const s = M.TL.scenes[i];
          seekTo(Math.min(s.t0 + 1.2, s.t1 - 0.05));
        });

        if (sc.type === 'screen') {
          field(card, L10N.fields.caption, sc, 'caption', i, true);
          (sc.actions || []).forEach((a) => {
            if (a.type === 'caption') field(card, L10N.fields.mid, a, 'text', i, true);
            else if (a.type === 'text') field(card, L10N.fields.text, a, 'text', i, false);
            else if (a.type === 'type') field(card, L10N.fields.type, a, 'text', i, false);
            else if (a.type === 'highlight' && a.label) field(card, L10N.fields.label, a, 'label', i, false);
          });
        } else {
          field(card, L10N.fields.title, sc, 'title', i, false);
          field(card, L10N.fields.subtitle, sc, 'subtitle', i, false);
        }
      });
    }

    onTick = () => {
      const idx = M.TL.scenes.findIndex((s) => now >= s.t0 && now < s.t1);
      cards.forEach((c, i) => c.classList.toggle('on', i === idx));
    };

    toggle.addEventListener('click', () => {
      document.body.classList.toggle('editing');
      fit();
      rebuild();
      onTick();
    });
    resetBtn.addEventListener('click', () => {
      draft = JSON.parse(original);
      rebuild();
      remount();
    });
    saveBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([exported()], { type: 'application/json' }));
      a.download = 'storyboard.edited.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(exported());
      } catch {
        const ta = $('textarea', '', document.body);
        ta.value = exported();
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copyBtn.textContent = L10N.copied;
      setTimeout(() => (copyBtn.textContent = L10N.copy), 1500);
    });

    status.textContent = L10N.clean;
    // For automated checks of the review panel.
    window.__vmEditor = { draft: () => draft, exported };
    if (window.innerWidth >= 1200) toggle.click();
  }

  if (!capture) setupEditor();
  fit();
  render(0);
  syncUi();
  if (!capture) setPlaying(true);
})();
</script>
</body>
</html>
